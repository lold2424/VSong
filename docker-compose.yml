version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE_NAME}:${BACKEND_IMAGE_TAG:-latest}
    container_name: vsong-backend-container
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER_CLASS_NAME}
      - YOUTUBE_API_KEYS=${YOUTUBE_API_KEYS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - OAUTH2_SUCCESS_REDIRECT_URL=${BASE_URL}
      # The following are properties from main.yml that were hardcoded or derived
      - LOGGING_FILE_NAME=logs/vtuber.log
      - LOGGING_FILE_PATH=logs
      - LOGGING_PATTERN_FILE=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=profile,email,https://www.googleapis.com/auth/youtube.readonly
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=${BASE_URL}/login/oauth2/code/google
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_NAME=Google
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_AUTHORIZATION_URI=https://accounts.google.com/o/oauth2/v2/auth
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKEN_URI=https://oauth2.googleapis.com/token
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_INFO_URI=https://www.googleapis.com/oauth2/v3/userinfo
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_NAME_ATTRIBUTE=sub
      - SERVER_PORT=8080
      - SERVER_SERVLET_SESSION_TIMEOUT=60m
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JACKSON_TIME_ZONE=Asia/Seoul
      - SPRING_TASK_SCHEDULING_ENABLED=true
    volumes:
      - ./logs:/app/logs # Mount logs directory
    restart: unless-stopped
    networks:
      - vsong-net

  frontend:
    build:
      context: ./front-next
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${BASE_URL}
    image: ${FRONTEND_IMAGE_NAME}:${FRONTEND_IMAGE_TAG:-latest}
    container_name: vsong-frontend-container
    restart: unless-stopped
    networks:
      - vsong-net
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: vsong-nginx-container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # Mount your SSL certificates here
      # - /etc/letsencrypt:/etc/letsencrypt
    restart: always
    networks:
      - vsong-net
    depends_on:
      - backend
      - frontend

networks:
  vsong-net:
    driver: bridge
