<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20010904//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg version="1.0" xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%" viewBox="0 0 549.000000 553.000000"
     preserveAspectRatio="xMidYMid meet">

    <defs>
        <!-- 1. 로고 내부 그라데이션 (왼쪽 민트 -> 중간 청록 연두 -> 오른쪽 라임 네온) -->
        <linearGradient id="neonGradient" x1="0%" y1="30%" x2="100%" y2="70%">
            <stop offset="0%" stop-color="#a2f0c7" />   <!-- 왼쪽 V자 (Mint) -->
            <stop offset="50%" stop-color="#67e69d" />  <!-- 중간 청록 연두 -->
            <stop offset="100%" stop-color="#b4f56c" /> <!-- 오른쪽 음표 (Neon) -->
        </linearGradient>

        <!-- 2. 네온 외곽 광채 (Glow) 효과 -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feFlood flood-color="#54d88e" flood-opacity="0.4" result="glowColor" />
            <feComposite in="glowColor" in2="blur" operator="in" result="softGlow" />
            <feMerge>
                <feMergeNode in="softGlow" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- 배경 사각형: 짙은 청록빛 다크 네이비 (#0f2d2e) -->
    <rect width="549" height="553" fill="#0f2d2e" rx="20" />

    <!-- 로고 심볼 그룹: 필터 및 그라데이션 적용 -->
    <g transform="translate(0.000000,553.000000) scale(0.100000,-0.100000)"
       fill="url(#neonGradient)" filter="url(#neonGlow)" stroke="none">

        <!-- [수정] 외부 프레임 마스크를 제외하고, 실제 글자/음표에 해당하는 내부 패스만 추출하여 배치했습니다. -->
        <!-- 오른쪽 음표/글자 부분 -->
        <path d="M3698 4666 c42 -22 65 -53 123 -166 47 -92 67 -118 164 -216 60 -61 164 -151 230
    -199 164 -122 293 -252 333 -335 88 -186 87 -399 -3 -595 -36 -80 -105 -171
    -160 -215 -72 -57 -85 -37 -54 81 33 123 31 270 -4 361 -64 166 -136 230 -439
    392 l-108 57 0 -839 c0 -804 -1 -842 -20 -916 -71 -277 -306 -466 -581 -466
    -89 0 -158 17 -244 59 -146 72 -250 192 -301 346 -112 340 74 688 418 780 95
    25 238 17 332 -19 37 -14 72 -26 77 -26 5 0 9 388 9 900 0 748 2 906 14 934
    32 76 143 119 214 82z" />

        <!-- 왼쪽 V자 글자 부분 -->
        <path d="M2020 3993 c137 -51 237 -122 304 -216 49 -68 406 -789 406 -818 0 -11 -49 -68 -113 -132
    -63 -61 -125 -128 -139 -147 l-26 -35 -199 405 c-218 442 -252 497 -336 536
    -48 22 -64 24 -219 24 -93 0 -168 -3 -168 -6 0 -4 9 -23 20 -43 10 -20 224 -447
    474 -949 251 -501 473 -939 495 -971 80 -117 224 -216 376 -257 87 -24 312 -30
    395 -11 36 9 66 15 67 14 4 -5 -64 -107 -92 -138 -157 -174 -345 -259 -545
    -245 -97 6 -189 32 -258 72 -166 97 -238 188 -380 484 -38 80 -159 325 -267
    545 -109 220 -257 522 -330 670 -73 149 -220 448 -328 666 -108 219 -198 412
    -201 430 -8 49 14 100 54 127 l35 23 460 -3 c438 -3 463 -5 515 -25z" />
    </g>
</svg>
