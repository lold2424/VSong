upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8080;
}

# HTTP (port 80) server: Redirects all traffic to HTTPS
server {
    listen 80;
    server_name vsong.site www.vsong.site; # Your domain name

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS (port 443) server: Handles all secure traffic
server {
    listen 443 ssl;
    server_name vsong.site www.vsong.site; # Your domain name

    # SSL Certificate paths (to be provided by Certbot)
    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/privkey.pem;

    # Recommended SSL settings
    include /etc/ssl/certs/options-ssl-nginx.conf;
    ssl_dhparam /etc/ssl/certs/ssl-dhparams.pem;

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
