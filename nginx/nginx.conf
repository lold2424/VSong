upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8080;
}

# HTTP (port 80) server: Redirects all traffic to HTTPS www
server {
    listen 80;
    server_name vsong.site www.vsong.site;

    return 301 https://www.vsong.site$request_uri;
}

# HTTPS (port 443) server: Redirect non-www to www
server {
    listen 443 ssl;
    server_name vsong.site;

    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/privkey.pem;
    include /etc/ssl/certs/options-ssl-nginx.conf;
    ssl_dhparam /etc/ssl/certs/ssl-dhparams.pem;

    return 301 https://www.vsong.site$request_uri;
}

# HTTPS (port 443) server: Handles all secure traffic for www
server {
    listen 443 ssl;
    server_name www.vsong.site;

    # SSL Certificate paths (to be provided by Certbot)
    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/privkey.pem;

    # Recommended SSL settings
    include /etc/ssl/certs/options-ssl-nginx.conf;
    ssl_dhparam /etc/ssl/certs/ssl-dhparams.pem;

    # Set client body size to 10M to allow file uploads
    client_max_body_size 10M;

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /api/vitals {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Route all OAuth2 and login callback requests to the backend
    location /oauth2/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /login/oauth2/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }
}
