# Server and Profiles
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.forward-headers-strategy=FRAMEWORK
server.servlet.session.timeout=60m

# Logging
logging.level.root=INFO
logging.level.com.VSong=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/vtuber.log
logging.file.path=logs
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jackson.time-zone=Asia/Seoul

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Caching
spring.cache.caffeine.spec=expireAfterWrite=1h

# YouTube API Keys
youtube.api.keys=${YOUTUBE_API_KEYS}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email,https://www.googleapis.com/auth/youtube.readonly,https://www.googleapis.com/auth/youtube
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.redirect-uri=${BASE_URL}/login/oauth2/code/google

# Add offline access for refresh token
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=select_account
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Gemini API Configuration (AI Validation)
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=

# Feature Settings
first-upload.enabled=true
first-upload.daily-limit=5000
first-upload.batch-size=30
spring.task.scheduling.enabled=true

# Actuator & CORS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
oauth2.success.redirect-url=${OAUTH2_REDIRECT_URL}

# Discord Bot Configuration
DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
DISCORD_BOT_ENABLED=true
