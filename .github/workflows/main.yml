name: VSong CI/CD to OCI with Docker

on:
  push:
    branches:
      - main
      - deploy

env:
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ghcr.io/${{ github.repository }}/frontend

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front-next
          file: ./front-next/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_and_push
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set Timezone to KST
        run: sudo timedatectl set-timezone Asia/Seoul

      - name: Create .env file for Docker Compose
        run: |
          echo "Creating .env file..."
          {
            echo "BACKEND_IMAGE_NAME=${{ env.BACKEND_IMAGE_NAME }}"
            echo "FRONTEND_IMAGE_NAME=${{ env.FRONTEND_IMAGE_NAME }}"
            echo "BACKEND_IMAGE_TAG=${{ github.sha }}"
            echo "FRONTEND_IMAGE_TAG=${{ github.sha }}"
            echo "DB_URL=${{ secrets.DB_URL }}"
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo "DB_DRIVER_CLASS_NAME=${{ secrets.DB_DRIVER_CLASS_NAME }}"
            echo "YOUTUBE_API_KEYS=${{ secrets.YOUTUBE_API_KEYS }}"
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
            echo "BASE_URL=${{ secrets.BASE_URL }}"
            echo "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${{ secrets.MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE }}"
            echo "MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=${{ secrets.MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS }}"
            echo "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}"
          } > .env
          echo ".env file created."

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update and Run Docker Compose
        run: |
          echo "--- Pulling new images from GHCR ---"
          docker-compose pull
          
          echo "--- Starting services with Docker Compose ---"
          docker-compose up -d --remove-orphans
          
          echo "--- Cleaning up old unused Docker images ---"
          docker image prune -af
