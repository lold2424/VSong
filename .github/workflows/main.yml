name: VSong CI/CD with Docker Compose

on:
  push:
    branches:
      - main
      - deploy
      - dev

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/vsong/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/vsong/frontend
  NGINX_IMAGE_NAME: ${{ github.repository_owner }}/vsong/nginx

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend.Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            JAR_FILE=build/libs/*.jar
          cache-from: type=gha,scope=${{ github.ref_name }}-backend
          cache-to: type=gha,scope=${{ github.ref_name }}-backend,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front-next/package-lock.json

      - name: Install dependencies and build
        working-directory: front-next
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=${{ secrets.BASE_URL }} npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend.Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}-frontend
          cache-to: type=gha,scope=${{ github.ref_name }}-frontend,mode=max

  build-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nginx.Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}-nginx
          cache-to: type=gha,scope=${{ github.ref_name }}-nginx,mode=max

  deploy:
    needs: [build-backend, build-frontend, build-nginx]
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Create .env file from secrets
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" > .env
          echo "REGISTRY=${{ env.REGISTRY }}" >> .env
          echo "BACKEND_IMAGE_NAME=${{ env.BACKEND_IMAGE_NAME }}" >> .env
          echo "FRONTEND_IMAGE_NAME=${{ env.FRONTEND_IMAGE_NAME }}" >> .env
          echo "NGINX_IMAGE_NAME=${{ env.NGINX_IMAGE_NAME }}" >> .env
          echo "DB_URL=${{ secrets.DB_URL }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "YOUTUBE_API_KEYS=${{ secrets.YOUTUBE_API_KEYS }}" >> .env
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" >> .env
          echo "OAUTH2_REDIRECT_URL=${{ secrets.BASE_URL }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_API_URL=${{ secrets.GEMINI_API_URL }}" >> .env
          echo "SPRING_THREADS_VIRTUAL_ENABLED=true" >> .env

      - name: Copy SSL certificates
        run: |
          mkdir -p ./nginx/ssl
          sudo cp /etc/letsencrypt/live/vsong.site/fullchain.pem ./nginx/ssl/fullchain.pem
          sudo cp /etc/letsencrypt/live/vsong.site/privkey.pem ./nginx/ssl/privkey.pem
          sudo cp /etc/letsencrypt/options-ssl-nginx.conf ./nginx/ssl/options-ssl-nginx.conf
          sudo cp /etc/letsencrypt/ssl-dhparams.pem ./nginx/ssl/ssl-dhparams.pem
          sudo chown -R ubuntu:ubuntu ./nginx/ssl

      - name: Deploy with Docker Compose
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker compose pull
          docker compose up -d --force-recreate
