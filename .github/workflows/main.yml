name: VSong CI/CD to OCI

on:
  push:
    branches:
      - main
      - deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./front-next
        run: |
          npm install
          NEXT_PUBLIC_API_URL=${{ secrets.BASE_URL }} npm run build

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Backend with Gradle
        run: ./gradlew build -x test

      - name: Package Artifacts
        run: |
          mkdir -p artifacts/backend
          find ./build/libs/ -name "*.jar" ! -name "*-plain.jar" -exec cp {} artifacts/backend/ \;
          
          # --- Create a clean frontend artifact ---
          echo "--- Preparing to package frontend artifact ---"
          
          echo "Checking for source directories..."
          if [ ! -d "./front-next/.next/standalone" ]; then
            echo "Error: Source directory ./front-next/.next/standalone not found!"
            exit 1
          fi
          if [ ! -d "./front-next/.next/static" ]; then
            echo "Error: Source directory ./front-next/.next/static not found!"
            exit 1
          fi
          if [ ! -d "./front-next/public" ]; then
            echo "Error: Source directory ./front-next/public not found!"
            exit 1
          fi
          echo "All source directories found."

          # 1. Force-delete any pre-existing artifact directory to ensure a clean slate
          echo "Cleaning up old artifacts..."
          rm -rf artifacts/frontend
          
          # 2. Create a new, empty directory for the artifact
          echo "Creating new artifact directory..."
          mkdir -p artifacts/frontend

          # 3. Copy ONLY the necessary files from the Next.js build output
          echo "Copying standalone server files..."
          cp -r ./front-next/.next/standalone/. artifacts/frontend/
          
          echo "Copying static assets..."
          cp -r ./front-next/.next/static artifacts/frontend/.next/
          
          echo "Copying public folder..."
          cp -r ./front-next/public artifacts/frontend/
          
          echo "Copying ecosystem config..."
          cp ./front-next/ecosystem.config.js artifacts/frontend/

      - name: Verify Frontend Artifact
        run: |
          echo "--- Verifying contents of artifacts/frontend ---"
          ls -lR artifacts/frontend

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-song-build
          path: artifacts/

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: v-song-build
          path: ./v-song-build

      - name: Deploy Application
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DRIVER_CLASS_NAME: ${{ secrets.DB_DRIVER_CLASS_NAME }}
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${{ secrets.MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE }}
          MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${{ secrets.MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS }}
          PORT: 3000
          HOSTNAME: '0.0.0.0'
        run: |
          set -e # 한 명령어라도 실패하면 즉시 중단

          echo "--- 배포 시작 ---"
          echo "현재 사용자: $(whoami)"
          echo "현재 디렉터리: $(pwd)"
          
          # Backend
          sudo mkdir -p /home/opc/vsong/backend
          sudo chown -R opc:opc /home/opc/vsong/
          
          PROPERTIES_FILE="/home/opc/vsong/backend/application.properties"
          echo "application.properties 파일 생성 중..."
          echo "spring.datasource.url=$DB_URL" | sudo tee $PROPERTIES_FILE
          echo "spring.datasource.username=$DB_USERNAME" | sudo tee -a $PROPERTIES_FILE
          echo "spring.datasource.password=$DB_PASSWORD" | sudo tee -a $PROPERTIES_FILE
          echo "spring.datasource.driver-class-name=$DB_DRIVER_CLASS_NAME" | sudo tee -a $PROPERTIES_FILE
          echo "youtube.api.keys=$YOUTUBE_API_KEYS" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.registration.google.client-id=$GOOGLE_CLIENT_ID" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.registration.google.client-secret=$GOOGLE_CLIENT_SECRET" | sudo tee -a $PROPERTIES_FILE
          echo "baseUrl=$BASE_URL" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.registration.google.scope=profile,email,https://www.googleapis.com/auth/youtube.readonly" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.registration.google.redirect-uri=\\\${baseUrl}/login/oauth2/code/google" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.registration.google.client-name=Google" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo" | sudo tee -a $PROPERTIES_FILE
          echo "spring.security.oauth2.client.provider.google.user-name-attribute=sub" | sudo tee -a $PROPERTIES_FILE
          echo "server.port=8080" | sudo tee -a $PROPERTIES_FILE
          echo "spring.jpa.hibernate.ddl-auto=update" | sudo tee -a $PROPERTIES_FILE
          echo "spring.jackson.time-zone=Asia/Seoul" | sudo tee -a $PROPERTIES_FILE
          echo "spring.task.scheduling.enabled=true" | sudo tee -a $PROPERTIES_FILE
          echo "management.endpoints.web.exposure.include=$MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE" | sudo tee -a $PROPERTIES_FILE
          echo "management.endpoint.health.show-details=$MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS" | sudo tee -a $PROPERTIES_FILE

          JAR_SOURCE_FILE=$(find ./v-song-build/backend/ -name "*.jar")
          JAR_DEST_PATH="/home/opc/vsong/backend/VSong.jar"
          echo "백엔드 JAR 파일 배포 중..."
          sudo cp $JAR_SOURCE_FILE $JAR_DEST_PATH

          echo "백엔드 서비스 재시작 중..."
          sudo systemctl restart vsong

          # Frontend
          FRONTEND_APP_PATH="/home/opc/vsong/frontend"
          echo "프론트엔드 배포 중: $FRONTEND_APP_PATH"
          
          echo "1단계: 이전 디렉터리 삭제"
          sudo rm -rf $FRONTEND_APP_PATH
          
          echo "2단계: 새 디렉터리 생성"
          sudo mkdir -p $FRONTEND_APP_PATH
          
          echo "3단계: 디렉터리 생성 확인"
          if [ ! -d "$FRONTEND_APP_PATH" ]; then
            echo "오류: $FRONTEND_APP_PATH 디렉터리가 생성되지 않았습니다."
            exit 1
          fi
          
          echo "4단계: 새 파일 복사"
          # 디버깅을 위해 복사 전후 파일 목록 출력
          echo "--- 복사 전 v-song-build/frontend/ 내용 ---"
          ls -lR ./v-song-build/frontend/
          sudo cp -r ./v-song-build/frontend/. $FRONTEND_APP_PATH
          echo "--- 복사 후 $FRONTEND_APP_PATH 내용 ---"
          ls -lR $FRONTEND_APP_PATH
          
          echo "5단계: 파일 복사 확인"
          if [ ! -f "$FRONTEND_APP_PATH/server.js" ]; then
            echo "오류: server.js 파일이 복사되지 않았습니다. 파일 복사에 실패했습니다."
            exit 1
          fi
          if [ ! -d "$FRONTEND_APP_PATH/.next" ]; then
            echo "오류: .next 디렉터리가 복사되지 않았습니다. 파일 복사에 실패했습니다."
            exit 1
          fi
          
          echo "6단계: 소유권 설정"
          sudo chown -R opc:opc $FRONTEND_APP_PATH

          echo "7단계: 프론트엔드 서비스 재시작"
          cd $FRONTEND_APP_PATH
          
          sudo -u opc pm2 startOrRestart ecosystem.config.js

          echo "--- 배포 성공적으로 완료 ---"